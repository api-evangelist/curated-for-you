          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        managed_status:
          type: string
          title: Managed Status
        admin_url:
          type: string
          title: Admin Url
      type: object
      required:
      - handle
      - title
      - type
      - product_count
      - updated_at
      - managed_status
      - admin_url
      title: AllCollectionResponse
      description: All Shopify collections — returned by GET /all-collections.
    AnalysisRequestBody:
      properties:
        title:
          type: string
          title: Title
      type: object
      required:
      - title
      title: AnalysisRequestBody
    Body_login_api_v2_users_login_post:
      properties:
        username:
          type: string
          title: Username
          default: jeffe@example.com
        password:
          type: string
          title: Password
          default: secretpassword
      type: object
      title: Body_login_api_v2_users_login_post
    CollectionResponse:
      properties:
        handle:
          type: string
          title: Handle
        title:
          type: string
          title: Title
        type:
          type: string
          title: Type
        product_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Product Count
        last_synced_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Synced At
        status:
          type: string
          title: Status
      type: object
      required:
      - handle
      - title
      - type
      - product_count
      - last_synced_at
      - status
      title: CollectionResponse
      description: CFY-managed collections — returned by GET /collections.
    ExecuteActionRequest:
      properties:
        action_id:
          type: string
          title: Action Id
      type: object
      required:
      - action_id
      title: ExecuteActionRequest
    FeedbackIngestRequest:
      properties:
        curation_id:
          type: integer
          title: Curation Id
        blocks:
          additionalProperties: true
          type: object
          title: Blocks
        action_context:
          additionalProperties: true
          type: object
          title: Action Context
      type: object
      required:
      - curation_id
      - blocks
      - action_context
      title: FeedbackIngestRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    StoreStatusResponse:
      properties:
        linked:
          type: boolean
          title: Linked
        shop_domain:
          type: string
          title: Shop Domain
      type: object
      required:
      - linked
      - shop_domain
      title: StoreStatusResponse
      description: Store link status — returned by GET /status.
    Token:
      properties:
        access_token:
          type: string
          title: Access Token
          description: Token used to authenticate future API requests
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..Y-KnsQHFu4MV67cBTzf92jbt65ex-gQIXPBSwWz5gBM
        token_type:
          type: string
