          \n--header 'Content-Type: application/json'\\\n\\\n --data-raw '{\n    \"username\": \"jeffe@example.com\"\
          ,\n    \"password\": \"secretpassword\"\n} '"
        label: Curl
      - lang: Python
        source: "import requests\nimport json\n\nurl = \"https://api.curatedforyou.io/api/v2/users/login\"\
          \npayload = json.dumps({\n    \"username\": \"jeffe@example.com\",\n    \"password\": \"secretpassword\"\
          \n})\nheaders ={\n    \"Authorization\": \"Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJPbmxpbmUgSldUIEJ1aWxkZXIiLCJpYXQiOjE2NzMwNDkxNzgsImV4cCI6MTcwNDU4NTE3OCwiYXVkIjoid3d3LmV4YW1w\"\
          ,\n    \"Content-Type\": \"application/json\"\n}\nresponse = requests.request(\"POST\", url,\
          \ headers=headers, data=payload)\nprint(response.json())"
        label: Python3
