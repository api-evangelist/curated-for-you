openapi: 3.2.0
info:
  title: Curated for You Users API
  description: '# API Usage Guide


    ## Overview


    The Curated for You API provides endpoints to manage and retrieve

    information authentication, curations, companies, and attributes.'
  version: 2.0.1
  x-logo:
    url: https://app.curatedforyou.io/cfy_logo.png
tags:
- name: Users
  x-displayName: Users
paths:
  /api/v2/users/login:
    post:
      summary: Login
      description: 'Authenticate yourself using your CFY App credentials.


        The response contains a bearer token, which you will need to provide to the **Authorization** header to make other requests in the Curation API.'
      operationId: login_api_v2_users_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_v2_users_login_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codeSamples:
      - lang: Shell
        source: "curl --location\\\n --request POST 'https://api.curatedforyou.io/api/v2/users/login'\\\n--header 'Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJPbmxpbmUgSldUIEJ1aWxkZXIiLCJpYXQiOjE2NzMwNDkxNzgsImV4cCI6MTcwNDU4NTE3OCwiYXVkIjoid3d3LmV4YW1w'\\\n--header 'Content-Type: application/json'\\\n\\\n --data-raw '{\n    \"username\": \"jeffe@example.com\",\n    \"password\": \"secretpassword\"\n} '"
        label: Curl
      - lang: Python
        source: "import requests\nimport json\n\nurl = \"https://api.curatedforyou.io/api/v2/users/login\"\npayload = json.dumps({\n    \"username\": \"jeffe@example.com\",\n    \"password\": \"secretpassword\"\n})\nheaders ={\n    \"Authorization\": \"Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJPbmxpbmUgSldUIEJ1aWxkZXIiLCJpYXQiOjE2NzMwNDkxNzgsImV4cCI6MTcwNDU4NTE3OCwiYXVkIjoid3d3LmV4YW1w\",\n    \"Content-Type\": \"application/json\"\n}\nresponse = requests.request(\"POST\", url, headers=headers, data=payload)\nprint(response.json())"
        label: Python3
      tags:
      - Users
components:
  schemas:
    Token:
      properties:
        access_token:
          type: string
          title: Access Token
          description: Token used to authenticate future API requests
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..Y-KnsQHFu4MV67cBTzf92jbt65ex-gQIXPBSwWz5gBM
        token_type:
          type: string
          title: Token Type
          description: Token type. Currently we only support OAuth 2.0 Bearer tokens
          default: bearer
      type: object
      required:
      - access_token
      title: Token
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Body_login_api_v2_users_login_post:
      properties:
        username:
          type: string
          title: Username
          default: jeffe@example.com
        password:
          type: string
          title: Password
          default: secretpassword
      type: object
      title: Body_login_api_v2_users_login_post
