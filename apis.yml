name: Curated for You
description: >-
  Curated for You is an Austin, Texas lifestyle-commerce platform (Techstars-backed)
  that matches retail products to shoppers' lifestyles — places, affinities, and
  trends — using a taxonomy of 1,000+ lifestyle concepts and AI to power product
  discovery across storefronts, Shopify, web, social, email, and organic search.
  The company works with retailers such as REVOLVE, Steve Madden, and Saks Off 5th,
  and has partnered with Microsoft to bring AI-powered curations into Copilot. The
  Curated for You API (v2, OpenAPI 3.1) lets integrators authenticate, discover the
  companies they can access, retrieve curations and exported curation snapshots,
  submit product feedback, and manage Shopify store installs, collections, and
  analysis/resync jobs.
